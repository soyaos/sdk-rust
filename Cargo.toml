[package]
name = "soyaos"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.85"
description = "Official pre-release placeholder for the future SoyaOS Rust SDK"
license = "MIT"
repository = "https://github.com/soyaos/sdk-rust"
homepage = "https://soyaos.ai"
documentation = "https://docs.rs/soyaos"
readme = "README.md"
keywords = ["agents", "ai", "sdk", "soyaos"]
publish = ["crates-io"]
include = [
  "src/**",
  "tests/**",
  "Cargo.toml",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
]

[lib]
path = "src/lib.rs"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[package.metadata.docs.rs]
all-features = true
