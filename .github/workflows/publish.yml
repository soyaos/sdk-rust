name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy --component rustfmt

      - name: Verify release tag matches Cargo.toml
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          TAG_VERSION="${RELEASE_TAG#v}"
          test "${PACKAGE_VERSION}" = "${TAG_VERSION}"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets --all-features

      - name: Package dry run
        run: cargo package --locked

  publish:
    name: Publish with Trusted Publishing
    if: github.event_name == 'release'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Exchange GitHub OIDC identity for a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish immutable crate version
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
